<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <section>
        <div class="container">
          <h1>Проста форма-анкета</h1>
          <form>
            <fieldset>
              <legend>Заповніть ваші дані</legend>
              <p>
                <label for="firstname">Ваше ім'я:</label>
                <input
                  id="firstname"
                  name="firstname"
                  placeholder="Введіть своє ім'я"
                  required
                  title="Поле обов'язкове для заповнення"
                />
              </p>
              <p>
                <label for="lasttname">Ваше прізвище:</label>
                <input
                  id="lasttname"
                  name="lasttname"
                  placeholder="Введіть своє прізвище"
                  required
                  title="Поле обов'язкове для заповнення"
                />
              </p>
              <p>
                <label for="email">Електронна пошта:</label>
                <input
                  id="email"
                  name="email"
                  placeholder="Email"
                  required
                  title="Поле обов'язкове для заповнення"
                />
              </p>
              <p>
                <label for="phone">Телефон:</label>
                <input
                  id="phone"
                  name="phone"
                  placeholder="Номер телефону"
                  required
                  title="Поле обов'язкове для заповнення"
                />
              </p>
            </fieldset>
            <fieldset>
              <legend>Дані про ваш курс</legend>
              <p>
                <label for="course">Оберіть ваш курс:</label>
                <select name="course" id="course">
                  <option value="none" disabled selected>
                    Оберіть ваш курс
                  </option>
                  <optgroup label="Front-end">
                    <option value="Basic">Front-end Basic</option>
                    <option value="Pro">Front-end Pro</option>
                  </optgroup>
                  <optgroup label="JavaScript">
                    <option value="R_JS">React JS</option>
                    <option value="N_JS">Node JS</option>
                  </optgroup>
                </select>
              </p>
              <p>
                <label for="homework"
                  >Чи виконуєте ви домашнє завдання:
                  <br />
                  <input
                    type="radio"
                    name="homework"
                    id="Так, виконую"
                    value="Так, виконую"
                  />
                  <span>Так, виконую</span>
                  <br />
                  <input
                    type="radio"
                    name="homework"
                    id="Ні, не встигаю"
                    value="Ні, не встигаю"
                  />
                  <span>Ні, не встигаю</span>
                </label>
              </p>
              <p>
                <label for="info"
                  >Додаткова інформація:
                  <br />
                  <input
                    type="checkbox"
                    name="info"
                    id="Буду продовжувати навчання"
                    value="Буду продовжувати навчання"
                  />
                  <span>Буду продовжувати навчання</span>
                  <br />
                  <input
                    type="checkbox"
                    name="info"
                    id="Додатково вивчаю англійську мову"
                    value="Додатково вивчаю англійську мову"
                  />
                  <span>Додатково вивчаю англійську мову</span>
                </label>
              </p>
            </fieldset>
            <p>
              <textarea
                cols="50"
                rows="10"
                placeholder="Коментар"
                style="resize: none"
              ></textarea>
            </p>
            <button type="submit">Зберегти відповідь</button>
          </form>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
